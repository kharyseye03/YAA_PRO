name: yaa_pro
description: "YAA PRO - Application mobile pour les livreurs"
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  # Textes des widgets Material en français (sélecteur de dates…)
  flutter_localizations:
    sdk: flutter

  # ── State Management ────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Navigation ──────────────────────────────────────────
  go_router: ^14.8.1

  # ── Network ─────────────────────────────────────────────
  http: ^1.2.2
  http_parser: ^4.0.2

  # ── Media ───────────────────────────────────────────────
  image_picker: ^1.1.2

  # ── Location & Maps ─────────────────────────────────────
  geolocator: ^13.0.2
  # Cartes + turn-by-turn natif Google (SKU « Navigation Request »).
  # Fournit aussi GoogleMapsMapView : google_maps_flutter n'est plus
  # nécessaire, et ne peut de toute façon pas cohabiter avec ce SDK.
  google_navigation_flutter: ^0.10.0

  # ── Notifications push ──────────────────────────────────
  # firebase_core lit la configuration native (google-services.json
  # sur Android) ; firebase_messaging reçoit les messages.
  # flutter_local_notifications sert uniquement à afficher la
  # notification quand l'app est déjà ouverte : dans ce cas Android
  # n'affiche rien de lui-même.
  # Mêmes versions que l'app client, pour un comportement identique.
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1

  # ── Data & Serialization ────────────────────────────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ── Local Storage ───────────────────────────────────────
  shared_preferences: ^2.3.4

  # ── UI & Assets ─────────────────────────────────────────
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_screenutil: ^5.9.3
  lucide_icons: ^0.257.0
  phosphor_flutter: ^2.1.0

  # ── Utils ───────────────────────────────────────────────
  # Version imposée par flutter_localizations
  intl: ^0.20.2
  url_launcher: ^6.3.1

  # ── Icons ───────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  remixicon: ^4.9.3
  geocoding: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # ── Code Generation ─────────────────────────────────────
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3
  flutter_launcher_icons: ^0.14.4

# ── Icône de lancement ────────────────────────────────────
# Régénérer après toute modification du logo :
#   dart run flutter_launcher_icons
#
# Les fichiers d'`assets/icon/` sont produits à partir de
# `logo_white.png` : ils ne sont pas déclarés dans `assets:` puisqu'ils
# ne servent qu'à la génération, jamais à l'affichage dans l'app.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  # Icône adaptative Android : le système masque le calque avant selon
  # la forme choisie par le constructeur, d'où un logo volontairement
  # réduit dans le fichier source pour rester dans la zone sûre.
  adaptive_icon_background: "#001554"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  # iOS interdit la transparence dans les icônes.
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  # ── Fonts ───────────────────────────────────────────────
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo/static/Archivo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Archivo/static/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo/static/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo/static/Archivo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Archivo/static/Archivo-ExtraBold.ttf
          weight: 800

  # ── Assets ──────────────────────────────────────────────
  # On déclare les fichiers un par un, jamais les dossiers : Flutter
  # embarque tout ce qu'un dossier déclaré contient, utilisé ou non.
  # `assets/images/` faisait ainsi voyager 30 Mo d'images mortes dans
  # chaque installation, dont un PNG de 4096 px jamais affiché.
  #
  # Les polices ne sont pas listées ici : la section `fonts:` ci-dessous
  # les empaquette déjà. Les déclarer aussi comme assets embarquait les
  # 112 fichiers du dossier — italiques, variables, README compris — en
  # plus des 5 graisses réellement utilisées.
  assets:
    - assets/images/logo_white.png
    - assets/images/map2.png
    - assets/images/ob2.jpeg
    - assets/images/ob1.png
    - assets/images/moto.png
    - assets/images/voiture.png
    - assets/images/cargo.png
